name: Build & Release EcovacsNoiDiaVN IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản (ví dụ: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: 'Ghi chú phiên bản'
        required: false
        default: 'Bản phát hành ứng dụng EcovacsNoiDiaVN kết nối Server Trung Gian VN (com.robot.vn.app)'

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build EcovacsNoiDiaVN.ipa
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Decrypt Source Code
        run: |
          pip install cryptography
          python scripts/decrypt_source.py
        env:
          SOURCE_ENCRYPTION_KEY: ${{ secrets.SOURCE_ENCRYPTION_KEY }}

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Determine Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VER="${{ github.event.inputs.version }}"
            NOTES="${{ github.event.inputs.release_notes }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/}"
            NOTES="Bản phát hành ${GITHUB_REF#refs/tags/}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG_VER="v1.0.0-${SHORT_SHA}"
            NOTES="Tự động build commit ${SHORT_SHA}"
          fi
          
          if [[ $TAG_VER == v* ]]; then
            CLEAN_VER="${TAG_VER#v}"
          else
            CLEAN_VER="$TAG_VER"
            TAG_VER="v$TAG_VER"
          fi
          
          IPA_FILENAME="EcovacsNoiDiaVN_${TAG_VER}.ipa"
          echo "VERSION=${TAG_VER}" >> $GITHUB_OUTPUT
          echo "CLEAN_VERSION=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "IPA_NAME=${IPA_FILENAME}" >> $GITHUB_OUTPUT
          echo "NOTES=${NOTES}" >> $GITHUB_OUTPUT

      - name: Build Archive (.xcarchive)
        run: |
          xcodebuild clean archive \
            -project EcovacsNoiDiaVN.xcodeproj \
            -scheme EcovacsNoiDiaVN \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/EcovacsNoiDiaVN.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          find ./build/EcovacsNoiDiaVN.xcarchive/Products/Applications -name "*.app" -maxdepth 1 -exec cp -r {} Payload/ \;
          find Payload/ -name ".DS_Store" -delete || true
          chmod -R 755 Payload/
          ls -la Payload/
          
          IPA_FILE="${{ steps.vars.outputs.IPA_NAME }}"
          zip -qry "${IPA_FILE}" Payload
          ls -lh "${IPA_FILE}"

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.IPA_NAME }}
          path: ${{ steps.vars.outputs.IPA_NAME }}
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.vars.outputs.VERSION }}
          name: EcovacsNoiDiaVN - ${{ steps.vars.outputs.VERSION }}
          body: |
            ### 🤖 Ứng dụng EcovacsNoiDiaVN (${{ steps.vars.outputs.VERSION }})
            
            **Thông tin ứng dụng:**
            - **Tên app:** `EcovacsNoiDiaVN`
            - **Bundle ID:** `com.robot.vn.app`
            - **Hạ tầng kết nối:** Server Trung Gian VN (`app.icouser.net`, `iot.icouser.net:8883`)
            
            **Ghi chú:**
            ${{ steps.vars.outputs.NOTES }}
            
            ---
            ### 📲 Hướng dẫn cài đặt file IPA:
            - **File:** `${{ steps.vars.outputs.IPA_NAME }}`
            - Cài đặt trên iPhone/iPad bằng **TrollStore** (không cần ký lại), **Sideloadly**, **ESign**, **Scarlet** hoặc **AltStore**.
          files: ${{ steps.vars.outputs.IPA_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
